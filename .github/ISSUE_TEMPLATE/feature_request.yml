name: Feature / RFC
description: Propose a viewpoint, a rule, a visual variable or a core extension.
title: "[rfc] "
labels: ["rfc"]
body:
  - type: markdown
    attributes:
      value: |
        Core changes require an RFC: read `AGENTS.md` §6.3 and use `docs/rfcs/0000-template.md`.
        A feature without 3–5 course topics is likely premature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be expressed now? Give concrete examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: New entity, field, viewpoint or rule. Include JSON sketch if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What existing concepts did you try?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - docs only
        - example only
        - schema (minor)
        - schema (major)
        - core ontology (RFC required)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I read the manifest and the AI handbook.
          required: true
        - label: I checked that existing viewpoints cannot solve this.
          required: true
        - label: I am not proposing UML/XMI compatibility.
          required: true
